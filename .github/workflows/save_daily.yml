name: Save daily bulletins

on:
  schedule:
    - cron: "47 9 * * *"   # every day 09:47 UTC = 10:47 Stockholm (winter time)
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

permissions:
  contents: write            # lets the workflow commit the new files back to the repo

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download today's bulletins
        run: python src/save_daily.py

      - name: Commit new files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Daily data $(date -u +%F)"
          git push
